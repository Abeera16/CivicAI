services:
  postgres:
    image: postgres:16-alpine
    container_name: civicai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicai_pass}
      POSTGRES_DB: ${POSTGRES_DB:-civicai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CIVICAI_API_URL: ${NEXT_PUBLIC_CIVICAI_API_URL:-http://localhost:8000/api}
    container_name: civicai_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_CIVICAI_API_URL: ${NEXT_PUBLIC_CIVICAI_API_URL:-http://localhost:8000/api}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
